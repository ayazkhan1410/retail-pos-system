<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>Tijori POS</title>
  <link rel="stylesheet" href="setup/setup.css">
  <script defer src="setup/renderer.js"></script>
</head>
<body>
  <header>
    <div class="brand"><img src="setup/tijori-mark.svg" alt="" width="32" height="32"><span>Tijori POS</span></div>
    <div class="languages" role="group" aria-label="Language / زبان">
      <button type="button" lang="en" id="en" aria-pressed="true">English</button>
      <button type="button" lang="ur" id="ur" aria-pressed="false">اردو</button>
    </div>
  </header>
  <main>
    <nav aria-label="Setup"><ol id="steps">
      <li data-key="store"></li><li data-key="owner"></li><li data-key="counters"></li>
    </ol></nav>
    <form id="form" novalidate>
      <section class="panel" id="store-step">
        <h1 tabindex="-1" data-key="storeTitle"></h1>
        <p data-key="storeHint"></p>
        <div class="grid">
          <label><span data-key="storeName"></span><input name="storeName" required maxlength="255" autocomplete="organization" dir="auto"></label>
          <label><span data-key="branchName"></span><input name="branchName" required maxlength="255" dir="auto"></label>
          <label><span data-key="phone"></span><input name="phone" type="tel" maxlength="30" dir="ltr" autocomplete="tel"></label>
          <label><span data-key="ntn"></span><input name="ntn" maxlength="30" dir="ltr"></label>
          <label class="wide"><span data-key="address"></span><input name="address" maxlength="2000" dir="auto" autocomplete="street-address"></label>
          <label class="wide"><span data-key="receiptFooter"></span><textarea name="receiptFooter" rows="2" maxlength="300" dir="auto"></textarea></label>
        </div>
      </section>
      <section class="panel" id="owner-step" hidden>
        <h1 tabindex="-1" data-key="ownerTitle"></h1>
        <p data-key="ownerHint"></p>
        <div class="grid">
          <label class="wide"><span data-key="ownerName"></span><input name="ownerName" maxlength="150" autocomplete="name" required dir="auto"></label>
          <label class="wide"><span data-key="ownerEmail"></span><input name="ownerEmail" type="email" maxlength="254" autocomplete="email" required dir="ltr"></label>
          <label><span data-key="password"></span><input name="password" type="password" autocomplete="new-password" required dir="auto"></label>
          <label><span data-key="confirmPassword"></span><input name="confirmPassword" type="password" autocomplete="new-password" required dir="auto"></label>
        </div>
      </section>
      <section class="panel" id="counter-step" hidden>
        <h1 tabindex="-1" data-key="counterTitle"></h1>
        <p data-key="counterHint"></p>
        <label class="counter"><span data-key="counterCount"></span><input name="counters" type="number" value="1" min="1" max="20" required dir="ltr"></label>
        <label class="consent"><input name="confirmMigration" type="checkbox" required><span data-key="confirmMigration"></span></label>
      </section>
      <div class="error" id="error" role="alert" hidden></div>
      <footer><button type="button" id="back" class="secondary" data-key="back" hidden></button><button id="next" type="submit" class="primary"></button></footer>
    </form>
    <section id="progress" class="panel" hidden>
      <h1 tabindex="-1" data-key="progressTitle"></h1>
      <p id="status" role="status" aria-live="polite"></p>
      <progress id="bar" value="0" max="100"></progress>
    </section>
  </main>
</body>
</html>
