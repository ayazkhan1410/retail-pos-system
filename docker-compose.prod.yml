# Production stack — static frontend build served by nginx.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups
    # gthread: short SSE streams share workers instead of pinning one sync worker each.
    command: sh -c "python manage.py migrate && gunicorn smartshop_pos.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --worker-class gthread --timeout 70"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health-check/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # A daily backup, keeping 14 days. Set BACKUP_OFFSITE_DIR (USB/NAS mount) so copies leave this disk.
  backup:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
    volumes:
      - ./backups:/backups
      - ${BACKUP_OFFSITE_DIR:-./backups}:/offsite
    command: >-
      sh -c 'while true; do
      STAMP=$$(date +%Y%m%d-%H%M%S);
      FILE="/backups/auto-$$STAMP.sql";
      pg_dump -U "$$POSTGRES_USER" "$$POSTGRES_DB" > "$$FILE.tmp"
      && mv "$$FILE.tmp" "$$FILE";
      if [ -n "$$BACKUP_OFFSITE_DIR" ] && [ "$$BACKUP_OFFSITE_DIR" != "./backups" ]; then
        cp "$$FILE" /offsite/;
      fi;
      find /backups -name "auto-*.sql" -mtime +14 -delete;
      sleep 86400; done'
    depends_on:
      # Wait for migrations, or the first backup would be of an empty database.
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Expiry alerts without waiting for a stock movement (every 6 hours).
  expiry-scan:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: >-
      sh -c 'while true; do
      python manage.py scan_expiry_alerts --force;
      sleep 21600; done'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
