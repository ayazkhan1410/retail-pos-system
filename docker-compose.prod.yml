# Production stack — static frontend build served by nginx.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups
    command: sh -c "python manage.py migrate && gunicorn smartshop_pos.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health-check/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # A daily backup, keeping 14 days. Copy ./backups off this machine: one disk failure would lose both.
  backup:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    command: >-
      sh -c 'while true; do
      pg_dump -U "$$POSTGRES_USER" "$$POSTGRES_DB" > "/backups/auto-$$(date +%Y%m%d-%H%M%S).sql.tmp"
      && mv /backups/auto-*.sql.tmp "/backups/auto-$$(date +%Y%m%d-%H%M%S).sql";
      find /backups -name "auto-*.sql" -mtime +14 -delete;
      sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
